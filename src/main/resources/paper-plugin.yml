name: Directions
version: ${version}
main: com.minecraftcitiesnetwork.directions.DirectionsPlugin
api-version: "26.3"
description: Transit directions between WorldGuard regions
authors: [MinecraftCitiesNetwork]

dependencies:
  server:
    WorldGuard:
      required: true
      load: BEFORE
    packetevents:
      required: true
      load: BEFORE
      join-classpath: true

permissions:
  directions.use:
    description: Use the /directions command
    default: true
  directions.reload:
    description: Reload directions config
    default: op
  gps.use:
    description: Use the /gps command
    default: true
  compass.use:
    description: Use the /compass command
    default: true
